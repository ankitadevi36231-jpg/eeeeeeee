<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 - Page Not Found | isaiyaa.bd</title>
<link rel="icon" href="https://i.postimg.cc/h4NZkpY8/image.png">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#05070f;color:#eef1f8;font-family:'Inter',sans-serif;text-align:center;padding:20px}
  .box{max-width:480px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.09);border-radius:24px;padding:48px 36px;backdrop-filter:blur(20px)}
  h1{font-family:'Poppins',sans-serif;font-size:72px;background:linear-gradient(135deg,#6a5cff,#a855f7);-webkit-background-clip:text;background-clip:text;color:transparent}
  h2{font-family:'Poppins',sans-serif;margin:8px 0 12px}
  p{color:#93a0b5;margin-bottom:24px;line-height:1.6}
  a.btn{display:inline-block;padding:13px 28px;border-radius:14px;background:linear-gradient(135deg,#6a5cff,#a855f7);color:#fff;text-decoration:none;font-weight:600;font-family:'Poppins',sans-serif}
</style>
</head>
<body>
  <div class="box">
    <h1>404</h1>
    <h2>Page Not Found</h2>
    <p>The page you are looking for does not exist or has been moved.</p>
    <a class="btn" href="/">Back to Home</a>
  </div>
</body>
</html>
